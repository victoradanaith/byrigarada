<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>RigaRada · ไพ่ตัวเลข 1–90</title>
<!-- Celtic Cross tray and large card view ported from the RigaRada tarot prototype (rigarada-mobile-fan-v2.html).
     Picking is a tap-to-pick panel of face-down cards with a shuffle step first; cards turn over as soon as the last one is picked. -->
<style>
:root{
  --bg:#f4f1ea;--surface:#fffdf8;--ink:#1f1d24;--muted:#5f5a68;--line:#d6cfc2;
  --accent:#5143a8;--accent-ink:#fff;--accent-soft:rgba(81,67,168,.16);
  --back1:#2b2838;--back2:#36324a;--back-line:#c9b98a;--ok:#2a7f5f;--focus:#c98a00;
  --ar:0.6;--rad:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14131a;--surface:#1f1d28;--ink:#ece8f2;--muted:#a9a4b6;--line:#3a3646;
  --accent:#a394ff;--accent-ink:#14131a;--accent-soft:rgba(163,148,255,.18);--ok:#4cc298;--focus:#ffcc4d;}}
:root[data-theme="dark"]{--bg:#14131a;--surface:#1f1d28;--ink:#ece8f2;--muted:#a9a4b6;--line:#3a3646;--accent:#a394ff;--accent-ink:#14131a;--accent-soft:rgba(163,148,255,.18);--ok:#4cc298;--focus:#ffcc4d;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI","Sukhumvit Set","Noto Sans Thai",sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
[hidden]{display:none!important}

/* access-code screen (screen gate only, not protection) */
#gate{min-height:100dvh;display:grid;place-items:center;padding:16px}
#gate form{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 24px;width:100%;max-width:340px;text-align:center}
#gate h1{margin:0 0 4px;font-size:1.3rem}
#gate p{margin:0 0 18px;color:var(--muted);font-size:.9rem}
#gate input{width:100%;font:inherit;font-size:1.4rem;letter-spacing:.4em;text-align:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
#gate .btn{margin-top:12px;width:100%}
#gate .err{color:#c0392b;min-height:1.4em;margin:10px 0 0;font-size:.9rem}

.app{max-width:440px;margin:0 auto;padding:12px 16px 0;min-height:100dvh;display:flex;flex-direction:column}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:1rem;font-weight:700;letter-spacing:.02em;margin:0}
.seg{display:flex;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:3px;gap:2px;margin:0;min-width:0}
.seg legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label{min-height:44px;min-width:56px;padding:0 12px;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:.9rem;font-weight:600;cursor:pointer}
.seg input:checked+label{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+label{outline:3px solid var(--focus)}
/* six reading sizes: the selector gets its own full-width row under the brand */
.top{flex-wrap:wrap}
.top #countSeg{flex:1 1 100%}
#countSeg label{flex:1;min-width:0;padding:0 2px;font-size:.85rem;white-space:nowrap}

/* deck switcher */
.decks{display:flex;flex-wrap:wrap;gap:6px;border:0;padding:0;margin:10px 0 0}
.decks legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.decks input{position:absolute;opacity:0;width:1px;height:1px}
.decks label{min-height:36px;padding:0 12px;display:flex;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:.82rem;font-weight:600;cursor:pointer}
.decks input:checked+label{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.decks input:focus-visible+label{outline:3px solid var(--focus)}

.status{margin:14px 0 8px}
.status h2{font-size:1.15rem;margin:0}
.status p{margin:2px 0 0;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.status p b{color:var(--ink)}
.status .deckname{font-size:.8rem;color:var(--muted);margin:0 0 2px}

/* tray */
.tray{display:flex;justify-content:center;gap:12px;list-style:none;margin:0;padding:0}
.tray.nudge{animation:nudge .35s}
@keyframes nudge{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.slot{width:64px}
.tray.n1 .slot{width:84px}
.tray.big .slot{width:min(28vw,108px)}
.tray.big.n1 .slot{width:140px}
.tray.n10{display:grid;gap:10px 8px}
.tray.n10 .slot{width:100%;min-width:0}
.tray.big.n10{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
.tray.big.n10 .slot{width:100%}
.tray.n10 .cardname{overflow-wrap:anywhere}
/* while picking, the tray already has the shape of the reading (RigaRada's reference images):
   4 in one row, 6 as 3+3, 9 as 3x3, 10 in the flat 10-card layout. Slots stay small so the panel has room. */
.tray.n6:not(.big),.tray.n9:not(.big),.tray.n10:not(.big){display:grid;justify-content:center;gap:6px 10px}
.tray.n6:not(.big),.tray.n9:not(.big){grid-template-columns:repeat(3,36px)}
.tray.n10:not(.big){grid-template-columns:repeat(4,30px)}
.tray.n6:not(.big) .slot,.tray.n9:not(.big) .slot,.tray.n10:not(.big) .slot{width:100%;min-width:0}
.tray.n10:not(.big) .slotname,.tray.n6:not(.big) .slotname,.tray.n9:not(.big) .slotname,.tray.n10:not(.big) .cardname,.tray.n6:not(.big) .cardname,.tray.n9:not(.big) .cardname{display:none}
.tray.n6:not(.big) .empty,.tray.n9:not(.big) .empty,.tray.n10:not(.big) .empty{font-size:.8rem}
.tray.n6:not(.big) .x,.tray.n9:not(.big) .x,.tray.n10:not(.big) .x{width:20px;height:20px;top:-6px;right:-6px;font-size:.65rem}
/* revealed 4, 6 and 9 cards: a grid sized by fitGrid() so every card fits on screen */
.tray.big.n4,.tray.big.n6,.tray.big.n9{display:grid;justify-content:center;gap:8px 12px}
.tray.big.n4{grid-template-columns:repeat(4,var(--slot-w,80px))}
.tray.big.n6,.tray.big.n9{grid-template-columns:repeat(3,var(--slot-w,90px))}
.tray.big.n4 .slot,.tray.big.n6 .slot,.tray.big.n9 .slot{width:var(--slot-w,90px)}
.tray.big.n4 .cardname,.tray.big.n6 .cardname,.tray.big.n9 .cardname{font-size:.7rem;overflow-wrap:anywhere}
.app:has(.tray.big.n4)>.decks,.app:has(.tray.big.n6)>.decks,.app:has(.tray.big.n9)>.decks{display:none}
.app:has(.tray.celtic){max-width:none;height:100dvh;min-height:0;padding-top:8px}
.app:has(.tray.celtic)>.top,.app:has(.tray.celtic)>.decks,.app:has(.tray.celtic)>.status,.app:has(.tray.celtic)>.spreadhelp,.app:has(.tray.celtic)>details,.app:has(.tray.celtic)>.foot{flex-shrink:0}
.app:has(.tray.celtic)>.status{margin:8px 0}
.app:has(.tray.celtic)>details,.app:has(.tray.celtic)>.decks{display:none}
.app:has(.tray.celtic) .foot{padding-top:6px}
.app:has(.tray.celtic) .spreadhelp{margin:4px 0;font-size:.75rem}
.tray.big.n10.celtic{flex:1;min-height:0;grid-template-columns:repeat(3,var(--spread-w)) var(--spread-w);grid-template-rows:repeat(3,minmax(0,1fr));gap:6px 8px;justify-content:center;align-items:start}
.tray.big.n10.celtic .slot{width:var(--spread-w);justify-self:center;position:relative}
.tray.celtic .cardname{display:none}
.tray.celtic .slotname{font-size:.65rem;text-align:center;height:26px;line-height:1.2;display:flex;align-items:center;justify-content:center}
.tray.celtic .box{width:var(--spread-w);height:var(--spread-h);aspect-ratio:auto!important}
/* 10 cards laid flat, every face visible, no card across another (layout from RigaRada's reference image):
   row 1: 10 at the right; row 2: 6 3 . 9; row 3: 2 1 4 8; row 4: . 5 . 7 */
.tray.n10 .slot:nth-child(1){grid-column:2;grid-row:2}
.tray.n10 .slot:nth-child(2){grid-column:1;grid-row:2}
.tray.n10 .slot:nth-child(3){grid-column:2;grid-row:1}
.tray.n10 .slot:nth-child(4){grid-column:3;grid-row:2}
.tray.n10 .slot:nth-child(5){grid-column:2;grid-row:3}
.tray.n10 .slot:nth-child(6){grid-column:1;grid-row:1}
.tray.n10 .slot:nth-child(7){grid-column:4;grid-row:3}
.tray.n10 .slot:nth-child(8){grid-column:4;grid-row:2}
.tray.n10 .slot:nth-child(9){grid-column:4;grid-row:1}
.tray.n10 .slot:nth-child(10){grid-column:3;grid-row:1}
@media(max-height:600px){
  .tray.celtic .slotname{font-size:0;height:14px;width:14px;position:absolute;top:0;left:0;z-index:3;background:var(--surface);border-radius:3px}
  .tray.celtic .slotname::before{content:attr(data-position);font-size:.7rem}
  .app:has(.tray.celtic) .status{margin:4px 0}
  .app:has(.tray.celtic) .spreadhelp{font-size:.7rem}
}
@media(max-height:450px){.app:has(.tray.celtic){padding-top:4px}.app:has(.tray.celtic) #countSeg label{min-height:32px}.app:has(.tray.celtic) .status h2{font-size:1rem;line-height:1.2}.app:has(.tray.celtic) .status p{font-size:.75rem;margin:0}.app:has(.tray.celtic) .foot{padding:4px 0}.app:has(.tray.celtic) .foot .btn{min-height:40px}.tray.celtic .slotbtn{min-width:44px;margin-left:min(0px,calc((var(--spread-w) - 44px)/2))}}
.spreadhelp{font-size:.85rem;color:var(--muted);margin:8px 0 14px}
.slotbtn{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;cursor:pointer;border-radius:10px;padding:2px}
.slotbtn:focus-visible{outline:3px solid var(--focus)}
.slotname{font-size:.75rem;font-weight:700;color:var(--muted)}
.box{position:relative;width:100%;aspect-ratio:var(--ar);perspective:700px}
.empty{position:absolute;inset:0;border:2px dashed var(--line);border-radius:var(--rad);display:grid;place-items:center;color:var(--muted);font-size:1.1rem}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.slot.flipped .flip{transform:rotateY(180deg)}
.flip>span{position:absolute;inset:0;border-radius:var(--rad);backface-visibility:hidden;-webkit-backface-visibility:hidden}
/* text-only face: every card the same size; text scales with the card */
.face{transform:rotateY(180deg);background:var(--surface);border:1px solid var(--line);box-shadow:inset 0 3px 0 var(--accent);container-type:size;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6% 7%;gap:4%;overflow:hidden}
.face b{font-size:clamp(7px,15cqw,20px);line-height:1.2;overflow-wrap:anywhere}
.face i{font-size:clamp(6px,10cqw,13px);line-height:1.2;color:var(--muted);overflow-wrap:anywhere}
.face small{font-size:clamp(6px,8.5cqw,11px);line-height:1.2;color:var(--accent);overflow-wrap:anywhere}
.cardname{font-size:.75rem;font-weight:650;text-align:center;line-height:1.25;margin-top:3px}

.x{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:.75rem;font-weight:800;box-shadow:0 0 0 2px var(--bg)}
.slot:not(.filled) .flip,.slot:not(.filled) .x,.slot.filled .empty,.locked .x{display:none}
.slot.pop .box{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.14)}}

/* card back */
.back{background:
  repeating-linear-gradient(45deg,var(--back1) 0 7px,var(--back2) 7px 14px);
  box-shadow:inset 0 0 0 4px var(--back1),inset 0 0 0 5px var(--back-line)}

/* tap-to-pick panel: every face-down card in view at once, no sideways scrolling */
.panelwrap{position:relative;margin:14px 0 4px}
.panelhint{font-size:.85rem;color:var(--muted);margin:0 0 8px;text-align:center}
/* the whole deck sits on the panel; it scrolls up and down once the cards are shuffled */
.panelscroll{max-height:max(220px,calc(100dvh - 380px));overflow-y:auto;overscroll-behavior:contain;padding:6px 4px;margin:0 -4px;border-radius:10px;background:var(--accent-soft)}
.panelscroll.locked{overflow:hidden}
.panel{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px 4px;position:relative}
.pcard.far{visibility:hidden}
.pcard{all:unset;box-sizing:border-box;display:block;aspect-ratio:var(--ar);border-radius:5px;cursor:pointer;
  background:repeating-linear-gradient(45deg,var(--back1) 0 3px,var(--back2) 3px 6px);
  box-shadow:inset 0 0 0 2px var(--back1),inset 0 0 0 3px var(--back-line),0 1px 3px rgba(0,0,0,.25);
  transition:transform .55s cubic-bezier(.2,.7,.2,1),box-shadow .15s}
.pcard.taken{visibility:hidden}
.pcard:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.panel.ready .pcard:hover{transform:translateY(-4px);box-shadow:inset 0 0 0 2px var(--back1),inset 0 0 0 3px var(--back-line),0 0 0 2px var(--accent),0 6px 12px rgba(0,0,0,.3)}
.panel:not(.ready) .pcard{cursor:default}
.panel.notrans .pcard{transition:none}
.mixbtn{position:absolute;left:50%;bottom:0;transform:translateX(-50%);z-index:50;min-width:180px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.panelwrap.locked{display:none}

.btn{min-height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:650;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn[aria-disabled="true"]{opacity:.42;cursor:not-allowed}

.foot{position:static;bottom:0;margin-top:auto;display:flex;gap:10px;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 80%,transparent);z-index:5}
.foot .btn{flex:1}
.foot .btn.primary{flex:2}

details.more{margin:10px 0 4px;font-size:.9rem}
details.more summary{min-height:44px;display:flex;align-items:center;color:var(--muted);cursor:pointer}
.morebody{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding-bottom:6px}
.morebody .seg label{min-width:48px;font-size:.85rem}
.morebody .lbl{font-size:.75rem;color:var(--muted);width:100%;margin-bottom:-6px}
.morebody .note{font-size:.75rem;color:var(--muted);margin:4px 0 0}

dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);width:min(360px,calc(100vw - 32px));padding:20px}
dialog::backdrop{background:rgba(10,8,20,.6)}
dialog h2{font-size:1.15rem;margin:0 0 6px}
dialog p{margin:0 0 4px;color:var(--muted)}
dialog .row{display:flex;gap:10px;margin-top:18px}
dialog .row .btn{flex:1}

/* large card view */
#dlgInspect{max-height:90dvh;overflow:auto}
.bigcard{width:min(220px,60vw);aspect-ratio:var(--ar);margin:14px auto;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:inset 0 4px 0 var(--accent),0 8px 22px rgba(0,0,0,.18);container-type:size;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8%;gap:4%}
.bigcard .bid{font-size:clamp(9px,6cqw,12px);color:var(--muted)}
.bigcard b{font-size:clamp(14px,12cqw,26px);line-height:1.2}
.bigcard i{font-size:clamp(11px,7.5cqw,16px);color:var(--muted)}
#dlgInspect .kw{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin:6px 0}
#dlgInspect .kw span{background:var(--accent-soft);border-radius:6px;padding:1px 8px;font-size:.8rem}
#inspectText{color:var(--ink);margin:6px 0 2px}
#inspectCat{font-size:.8rem}

.rm *,.rm *::before,.rm *::after{transition:none!important;animation:none!important}
.face b{font-size:clamp(20px,14cqw,64px)}
</style>
</head>
<body>
<main class="app" id="app">
  <div class="top">
    <h1 class="brand">RigaRada</h1>
    <fieldset class="seg" id="countSeg" hidden>
      <legend>จำนวนไพ่</legend>
      <input type="radio" name="count" id="c10" value="10" checked><label for="c10">10 ใบ</label>
    </fieldset>
  </div>

  <fieldset class="decks" id="deckSeg" hidden><legend>สำรับ</legend></fieldset>

  <div class="status">
    <p class="deckname" id="deckName"></p>
    <h2 id="headline" tabindex="-1"></h2>
    <p id="progress"></p>
  </div>

  <ol class="tray" id="tray" aria-label="ไพ่ที่เลือก"></ol>
  <p class="spreadhelp" id="spreadHelp" hidden></p>

  <div class="panelwrap" id="panelWrap">
    <p class="panelhint" id="panelHint"></p>
    <div class="panelscroll" id="panelScroll"><div class="panel" id="panel" role="group" aria-label="แผงไพ่คว่ำ" aria-describedby="panelHelp"></div></div>
    <button class="btn primary mixbtn" id="bMix" type="button">สับไพ่</button>
  </div>
  <p id="panelHelp" class="sr-only">ใช้ปุ่มลูกศรเลื่อนระหว่างไพ่ กด Enter หรือ Space เพื่อเลือกใบนั้น</p>

  <details class="more">
    <summary>ตัวเลือกเพิ่มเติม</summary>
    <div class="morebody">
      <span class="lbl" aria-hidden="true">การเคลื่อนไหว</span>
      <fieldset class="seg"><legend>ลดการเคลื่อนไหว</legend>
        <input type="radio" name="motion" id="r-auto" value="auto"><label for="r-auto">อัตโนมัติ</label>
        <input type="radio" name="motion" id="r-on" value="on"><label for="r-on">ลด</label>
        <input type="radio" name="motion" id="r-off" value="off"><label for="r-off">เต็ม</label>
      </fieldset>
      <p class="note">RigaRada · เลือกจำนวนไพ่ สับไพ่ แล้วแตะเลือกจากแผง</p>
    </div>
  </details>

  <div class="foot">
    <button class="btn" id="bUndo" type="button">ย้อนกลับ</button>
    <button class="btn" id="bReshuffle" type="button">สับไพ่ใหม่</button>
    <button class="btn primary" id="bNew" type="button" hidden>เริ่มใหม่</button>
  </div>
</main>

<div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<dialog id="dlgInspect" aria-labelledby="inspectTitle">
  <h2 id="inspectTitle"></h2>
  <p id="inspectMeaning"></p>
  <div class="bigcard" aria-hidden="true"><span class="bid" id="inspectId"></span><b id="inspectTh"></b><i id="inspectEn"></i></div>
  <p class="sr-only" id="inspectName"></p>
  <div class="kw" id="inspectKw"></div>
  <p id="inspectText"></p>
  <p id="inspectCat"></p>
  <div class="row"><button class="btn" id="inspectPrev" type="button">ก่อนหน้า</button><button class="btn" id="inspectNext" type="button">ถัดไป</button></div>
  <div class="row"><button class="btn primary" id="inspectClose" type="button">กลับไปที่การวางไพ่</button></div>
</dialog>

<script>
(()=>{
"use strict";

/* ---------------- panel rendering ---------------- */
function cards(){return [...panel.querySelectorAll('.pcard')]}
function buildPanel(){
  let els=cards();
  if(els.length!==S.panel.length){        // a new deck or a new deal: make the buttons once
    panel.replaceChildren();
    S.panel.forEach((_,i)=>{
      const b=document.createElement('button');b.type='button';b.className='pcard';b.dataset.i=i;
      b.onclick=()=>pick(i);panel.appendChild(b);
    });
    els=cards();
  }
  // Update in place, so the panel keeps its scroll position after every pick.
  els.forEach((b,i)=>{
    const taken=S.panel[i]===null;
    b.classList.toggle('taken',taken);b.tabIndex=-1;
    b.setAttribute('aria-label',`ไพ่คว่ำใบที่ ${i+1} จาก ${S.panel.length}`);
    if(taken)b.setAttribute('aria-hidden','true');else b.removeAttribute('aria-hidden');
  });
  const open=S.panel.map((id,i)=>id===null?-1:i).filter(i=>i>=0);
  if(!open.includes(S.cur))S.cur=open[0]??0;
  const c=els[S.cur];if(c)c.tabIndex=0;
  panel.classList.toggle('ready',S.mixed&&!S.revealed);
  scroller.classList.toggle('locked',!S.mixed||S.busy);
  if(!S.mixed){
    scroller.scrollTop=0;markFar(true);
    // The frame can arrive late (background tab), so re-check that the cards are still waiting to be shuffled.
    requestAnimationFrame(()=>{if(!S.mixed&&!S.revealed)pile(false)});
  }

// Only the first ANIM cards take part in the pile and shuffle animation; the rest wait hidden.
function markFar(on){cards().forEach((el,i)=>el.classList.toggle('far',on&&i>=ANIM))}
function animCards(){return cards().slice(0,ANIM)}
// Gather the cards into one face-down pile in the middle of the visible panel.
function pile(animate){
  const pr=scroller.getBoundingClientRect(),cx=pr.left+pr.width/2,cy=pr.top+Math.min(pr.height,260)/2;
  if(!animate)panel.classList.add('notrans');
  animCards().forEach((el,k)=>{
    const r=el.getBoundingClientRect();
    el.style.transform=`translate(${(cx-r.left-r.width/2).toFixed(1)}px,${(cy-r.top-r.height/2).toFixed(1)}px) rotate(${rand(-8,8).toFixed(1)}deg)`;
    el.style.zIndex=String(k);
  });
  if(!animate){void panel.offsetWidth;panel.classList.remove('notrans')}
}
function scatter(){
  const pr=scroller.getBoundingClientRect(),bottom=pr.top+Math.min(pr.height,260);
  animCards().forEach(el=>{
    const r=el.getBoundingClientRect();
    const tx=rand(pr.left,pr.right-r.width)-r.left,ty=rand(pr.top,bottom-r.height)-r.top;
    el.style.transform=`translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px) rotate(${rand(-40,40).toFixed(1)}deg)`;
    el.style.zIndex=String(Math.random()*100|0);
  });
}
function spread(){cards().forEach(el=>{el.style.transform='';el.style.zIndex=''})}

/* ---------------- actions ---------------- */
// Shuffle: deal a new panel from the shuffled deck, mix the cards on screen, then lay them out to pick from.
function mix(){
  if(S.revealed||S.busy)return;
  if(S.mixed||chosen().length)snap();
  deal();S.mixed=true;S.cur=0;S.busy=true;
  const generation=++mixGeneration;
  const wasPiled=!panel.classList.contains('ready')&&cards().length;
  renderStatus();renderPanelOnly(true);
  scroller.scrollTop=0;scroller.classList.add('locked');markFar(true);
  const finish=()=>{if(generation!==mixGeneration)return;S.busy=false;markFar(false);spread();panel.classList.add('ready');
    scroller.classList.remove('locked');renderStatus();
    const c=cards()[S.cur];c&&c.focus({preventScroll:true});say(`สับไพ่แล้ว แตะเลือกไพ่ได้เลย ${S.count} ใบ`)};
  if(reduced()){finish();return}
  if(!wasPiled)pile(true);
  const steps=[()=>scatter(),()=>scatter(),()=>pile(true),()=>scatter(),()=>finish()];
  let k=0;const run=()=>{if(generation!==mixGeneration)return;steps[k++]();if(k<steps.length)setTimeout(run,340)};
  setTimeout(run,wasPiled?60:380);
}
function pick(i){
  if(!S.mixed||S.revealed||S.busy)return;
  const id=S.panel[i];if(id===null||id===undefined||S.slots.includes(id))return;
  const slot=S.slots.indexOf(null);
  if(slot<0){say(`เลือกครบ ${S.count} ใบแล้ว`);nudge();return}
  snap();S.panel[i]=null;S.slots[slot]=id;S.from[slot]=i;
  const next=S.panel.findIndex((v,k)=>v!==null&&k>i);S.cur=next>=0?next:Math.max(0,S.panel.findIndex(v=>v!==null));
  renderAll();
  const s=document.querySelector(`.slot[data-i="${slot}"]`);if(s)s.classList.add('pop');
  const n=chosen().length,left=S.count-n;
  if(left){say(`เลือกแล้ว${S.count>1?' ตำแหน่ง '+POS[S.count][slot]:''} เหลืออีก ${left} ใบ`);const c=cards()[S.cur];c&&c.focus({preventScroll:true});return}
  say('เลือกครบแล้ว กำลังเปิดไพ่');
  const generation=revealGeneration;
  setTimeout(()=>{if(generation===revealGeneration&&!S.revealed&&chosen().length===S.count)reveal()},reduced()?0:450);
}
function removeSlot(i){
  if(S.revealed||S.slots[i]===null)return;
  snap();const id=S.slots[i],f=S.from[i];S.slots[i]=null;S.from[i]=null;
  if(f!==null&&S.panel[f]===null){S.panel[f]=id;S.cur=f}   // the card goes back to its place on the panel
  renderAll();
  const b=document.querySelector(`.slot[data-i="${i}"] .slotbtn`);b&&b.focus();
  say(`เอา${POS[S.count][i]}กลับเข้าแผงแล้ว เลือก ${chosen().length} จาก ${S.count}`);
}
function undo(){
  if(S.revealed||S.busy||!S.hist.length)return;
  Object.assign(S,JSON.parse(S.hist.pop()));syncControls();renderAll();
  say(`ย้อนกลับแล้ว เลือก ${chosen().length} จาก ${S.count}`);
}
function setCount(n){
  if(n===S.count)return;
  if(S.revealed)newReading(false);
  snap();
  const keep=S.slots.map((id,i)=>({id,f:S.from[i]})).filter(x=>x.id!==null);
  S.count=n;S.slots=Array(n).fill(null);S.from=Array(n).fill(null);
  keep.forEach((x,i)=>{if(i<n){S.slots[i]=x.id;S.from[i]=x.f}else if(x.f!==null&&S.panel[x.f]===null)S.panel[x.f]=x.id});
  renderAll();
  say(`โหมด ${n} ใบ เลือก ${chosen().length} จาก ${n}`+(keep.length>n?' ไพ่ที่เกินกลับเข้าแผงแล้ว':''));
  if(S.mixed&&chosen().length===S.count){const g=revealGeneration;setTimeout(()=>{if(g===revealGeneration&&!S.revealed)reveal()},reduced()?0:450)}
}
function reveal(){
  const generation=++revealGeneration;
  S.revealed=true;S.hist=[];renderAll();
  const slots=[...document.querySelectorAll('.slot')];
  let i=0;
  const step=()=>{
    if(!S.revealed||generation!==revealGeneration)return;
    const li=slots[i],id=S.slots[i];
    renderFace(li,id); // Card identity is written to the DOM only when the card is turned over.
    li.classList.add('flipped');
    li.querySelector('.slotbtn').setAttribute('aria-label',`${positionLabel(i)}: ${faceLabel(id)} แตะเพื่อดูใบใหญ่`);
    if(S.count===10)li.querySelector('.slotname').textContent=positionLabel(i);
    i++;
    if(i<slots.length)setTimeout(step,reduced()?0:520);
    else setTimeout(()=>{
      if(!S.revealed||generation!==revealGeneration)return;
      $('#headline').textContent='ผลการเปิดไพ่';$('#headline').focus();
      say('เปิดแล้ว '+S.slots.map((id,k)=>`${positionLabel(k)}: ${faceLabel(id)}`).join(' · '));

      fitCeltic(); // Include the visible New reading control in the final viewport budget.
    },reduced()?0:450);

function renderFace(li,id){
  const card=DECK[id],face=li.querySelector('.face');
  face.replaceChildren();face.dataset.cardId=card.id;
  const th=document.createElement('b');th.textContent=card.name_th;

  li.querySelector('.slotbtn').append(label);
}
function newReading(announce=true){
  revealGeneration++;mixGeneration++;  // cancel callbacks from the reading being replaced
  S.revealed=false;S.busy=false;S.hist=[];S.mixed=false;S.cur=0;
  S.slots=Array(S.count).fill(null);S.from=Array(S.count).fill(null);
  S.panel=shuffled([...Array(N).keys()]).slice(0,panelSize());

  $('#inspectMeaning').textContent=S.count===10?CONTEXT[i]:'';$('#inspectMeaning').hidden=S.count!==10;
  $('#inspectId').textContent=card.id;$('#inspectTh').textContent=card.name_th;
  $('#inspectEn').textContent=card.name_en;$('#inspectEn').hidden=!card.name_en;
  $('#inspectName').textContent=faceLabel(S.slots[i]);
  const kw=$('#inspectKw');kw.replaceChildren(...card.keywords.map(k=>{const s=document.createElement('span');s.textContent=k;return s}));
  kw.hidden=!card.keywords.length;
  $('#inspectText').textContent=card.meaning;$('#inspectText').hidden=!card.meaning;
  $('#inspectCat').textContent=card.category?'หมวด: '+card.category:'';
  const multi=S.count>1;$('#inspectPrev').hidden=$('#inspectNext').hidden=!multi;
  setDis($('#inspectPrev'),i===0);setDis($('#inspectNext'),i===S.count-1||!isFlipped(i+1));
  if(!$('#dlgInspect').open)$('#dlgInspect').showModal();
}
function nudge(){const t=$('#tray');t.classList.remove('nudge');void t.offsetWidth;t.classList.add('nudge')}

/* ---------------- rendering ---------------- */
function renderAll(){
  document.documentElement.classList.toggle('rm',reduced());
  renderTray();renderPanelOnly(false);renderStatus();fitCeltic();fitGrid();
}
function renderPanelOnly(keepPile){
  $('#panelWrap').classList.toggle('locked',S.revealed);
  if(!keepPile){buildPanel();return}
  // During a mix keep the existing elements so they can animate; just reset which are taken.
  if(cards().length!==S.panel.length)buildPanel();
  cards().forEach((el,i)=>{el.classList.toggle('taken',S.panel[i]===null);el.tabIndex=i===S.cur?0:-1});
  panel.classList.remove('ready');
}
function fitCeltic(){
  if(!S.revealed||S.count!==10)return;
  const tray=$('#tray'),r=tray.getBoundingClientRect();
  const label=tray.querySelector('.slotname'),extra=getComputedStyle(label).position==='absolute'?4:label.offsetHeight+8;
  const h=Math.max(12,Math.min(160,(r.width-24)/2.5,(r.height-3*extra-12)/3));
  tray.style.setProperty('--spread-h',h+'px');tray.style.setProperty('--spread-w',(h*.6)+'px');
}
// Revealed 4/6/9-card grids: size the cards from the space left on screen, the way fitCeltic sizes the Celtic Cross.
function fitGrid(){
  const g=GRID[S.count],tray=$('#tray');
  if(!S.revealed||!g){tray.style.removeProperty('--slot-w');return}
  const [cols,rows]=g,top=tray.getBoundingClientRect().top+scrollY;
  const below=76+100;                                   // footer button, help line and the options row
  const avail=innerHeight-top-below, perRow=48;         // position label, card name and gap per row
  const byH=(avail-rows*perRow)/rows*0.6, byW=(tray.clientWidth-(cols-1)*12)/cols;
  tray.style.setProperty('--slot-w',Math.max(48,Math.min(byH,byW,130))+'px');
}
function renderTray(){
  const ol=$('#tray');ol.innerHTML='';
  ol.className='tray n'+S.count+(S.revealed?' big locked':'')+(S.revealed&&S.count===10?' celtic':'');
  $('#spreadHelp').hidden=!S.revealed;
  $('#spreadHelp').textContent=S.count===10?'วาง 10 ใบ · แตะไพ่เพื่อดูใบใหญ่':'แตะไพ่เพื่อดูใบใหญ่';
  S.slots.forEach((id,i)=>{
    const li=document.createElement('li');li.className='slot'+(id!==null?' filled':'');li.dataset.i=i;
    li.innerHTML=`<button class="slotbtn" type="button"><span class="slotname" aria-hidden="true">${POS[S.count][i]}</span>
      <span class="box" aria-hidden="true"><span class="empty">${S.count>1?i+1:'?'}</span>
      <span class="flip"><span class="back"></span><span class="face"></span></span><span class="x">✕</span></span></button>`;
    li.querySelector('.slotname').dataset.position=i+1;
    const b=li.querySelector('.slotbtn');
    b.setAttribute('aria-label',id===null?`${POS[S.count][i]}: ว่าง`:`${POS[S.count][i]}: เลือกไพ่คว่ำแล้ว กดเพื่อเอากลับเข้าแผง`);
    b.onclick=()=>{if(S.revealed){inspectCard(i);return}if(S.slots[i]!==null)removeSlot(i);else say(`${POS[S.count][i]} ยังว่าง`)};
    b.onkeydown=e=>{if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();removeSlot(i)}};
    ol.appendChild(li);
  });
}
function renderStatus(){
  const n=chosen().length,left=S.count-n,onPanel=S.panel.filter(x=>x!==null).length;
  $('#deckName').textContent=`สำรับ ${deckIdx+1}/${DECKS.length} · ${DECKS[deckIdx].th} · ${DECKS[deckIdx].en}`;
  document.title='RigaRada · '+DECKS[deckIdx].label;
  $('#headline').textContent=S.revealed?'กำลังเปิดไพ่…':!S.mixed?'สับไพ่ก่อนเลือก':S.busy?'กำลังสับไพ่…':left?`เลือกใบที่ ${n+1} จาก ${S.count}`:'กำลังเปิดไพ่…';
  $('#progress').innerHTML=`<b>เลือก ${n} จาก ${S.count}</b> · บนแผง ${onPanel} ใบ · ทั้งสำรับ ${N} ใบ`;
  $('#panelHint').textContent=!S.mixed?`สับไพ่ทั้งสำรับ แล้ววางไพ่ทั้ง ${N} ใบบนแผงให้แตะเลือก`:`แตะไพ่ใบที่อยากได้ · เลื่อนขึ้นลงเพื่อดูครบ ${onPanel} ใบ`;
  $('#bMix').hidden=S.mixed||S.revealed;
  $('#bUndo').hidden=S.revealed;setDis($('#bUndo'),!S.hist.length||S.busy);
  $('#bReshuffle').hidden=S.revealed||!S.mixed;setDis($('#bReshuffle'),S.busy);
  $('#bNew').hidden=!S.revealed||!document.querySelector('.slot.flipped:last-child');
}

/* ---------------- keyboard: arrow keys move between cards on the panel ---------------- */
panel.addEventListener('keydown',e=>{
  if(!S.mixed||S.revealed)return;
  const open=S.panel.map((v,i)=>v===null?-1:i).filter(i=>i>=0);if(!open.length)return;
  let to=null;const cur=S.cur;
  const nearest=t=>open.reduce((a,b)=>Math.abs(b-t)<Math.abs(a-t)?b:a);
  switch(e.key){
    case 'ArrowRight':to=open.find(i=>i>cur)??cur;break;
    case 'ArrowLeft':to=[...open].reverse().find(i=>i<cur)??cur;break;
    case 'ArrowDown':to=cur+COLS<S.panel.length?nearest(cur+COLS):cur;break;
    case 'ArrowUp':to=cur-COLS>=0?nearest(cur-COLS):cur;break;
    case 'Home':to=open[0];break;
    case 'End':to=open[open.length-1];break;
    default:return;
  }
  e.preventDefault();
  const els=cards();els.forEach(el=>el.tabIndex=-1);S.cur=to;els[to].tabIndex=0;els[to].focus();
});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'&&!document.querySelector('dialog[open]')){e.preventDefault();undo()}
});
$('#dlgInspect').addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'){e.preventDefault();inspectCard(inspectIndex-1)}
  else if(e.key==='ArrowRight'){e.preventDefault();inspectCard(inspectIndex+1)}
});

/* ---------------- wiring ---------------- */
const on=(id,fn,always)=>$(id).addEventListener('click',()=>{if(!always&&isDis($(id)))return;fn()});
on('#bMix',mix,true);
on('#bReshuffle',mix);
on('#bUndo',undo);
on('#bNew',()=>newReading(),true);
on('#inspectPrev',()=>inspectCard(inspectIndex-1));on('#inspectNext',()=>inspectCard(inspectIndex+1));
$('#inspectClose').onclick=()=>$('#dlgInspect').close();

function syncControls(){
  for(const k of ['count','motion']){const el=document.querySelector(`input[name="${k}"][value="${S[k]}"]`);if(el)el.checked=true}
  const d=document.querySelector(`input[name="deck"][value="${deckIdx}"]`);if(d)d.checked=true;
}
document.querySelectorAll('input[type=radio]').forEach(inp=>inp.addEventListener('change',()=>{
  if(inp.name==='count'){setCount(+inp.value);return}
  if(inp.name==='deck'){setDeck(+inp.value);return}
  S[inp.name]=inp.value;
  document.documentElement.classList.toggle('rm',reduced());
}));
mqRM.addEventListener?.('change',()=>document.documentElement.classList.toggle('rm',reduced()));
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(!S.mixed&&!S.revealed)pile(false);fitCeltic();fitGrid()},80)});

syncControls();newReading(false);
}
})();
</script>
</body>
</html>
